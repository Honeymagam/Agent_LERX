services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: agent
      POSTGRES_USER: agent
      POSTGRES_PASSWORD: agent
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agent -d agent"]
      interval: 5s
      timeout: 5s
      retries: 10
  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://agent:agent@postgres:5432/agent
      WORKSPACE_ROOT: /workspaces
    volumes: [agent-workspaces:/workspaces]
    ports: ["8000:8000"]
    depends_on: {postgres: {condition: service_healthy}}
  frontend:
    build: ./frontend
    ports: ["3000:80"]
    depends_on: [backend]
volumes:
  postgres-data:
  agent-workspaces:
